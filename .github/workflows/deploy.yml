# Merge to main  ->  CI  ->  deploy STAGING automatically
#                ->  wait for approval  ->  back up prod DB  ->  deploy PRODUCTION
#
# The approval gate comes from the GitHub "production" environment's
# "Required reviewers" setting (see README, "One-time GitHub setup").
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Trigger Render deploy of this exact commit
        run: curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Wait until staging is running this commit
        run: ./scripts/wait-for-version.sh "${{ vars.STAGING_URL }}" "${GITHUB_SHA::7}"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5
      # The repo is public, so artifacts are downloadable by anyone. The dump is
      # encrypted with BACKUP_PASSPHRASE before upload and the plain file never
      # leaves the runner. See README "Restoring a backup".
      - name: Back up production database before deploying (encrypted)
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "BACKUP_PASSPHRASE secret is not set" >&2; exit 1; fi
          docker run --rm postgres:17-alpine pg_dump --format=custom --no-owner "$DATABASE_URL" > prod.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
              --passphrase-fd 3 --output "prod-before-${GITHUB_SHA::7}.dump.gpg" prod.dump 3<<<"$BACKUP_PASSPHRASE"
          shred -u prod.dump
          ls -lh *.gpg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v5
        with:
          name: prod-backup-${{ github.sha }}
          path: '*.dump.gpg'
          if-no-files-found: error
          retention-days: 30
      - name: Trigger Render deploy of this exact commit
        run: curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Wait until production is running this commit
        run: ./scripts/wait-for-version.sh "${{ vars.PRODUCTION_URL }}" "${GITHUB_SHA::7}"
