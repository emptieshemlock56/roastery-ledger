# Runs on every pull request and every push to main.
# Branch protection on `main` should require this to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests (embedded Postgres)
        run: npm test
      - name: Tests (real Postgres, same as staging/prod)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger_test
      - name: Build web app
        run: npm run build
