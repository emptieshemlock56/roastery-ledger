# Render Blueprint: two fully separate environments, each with its own web
# service and its own database. Nothing is shared between staging and production.
#
# autoDeploy is OFF on purpose: deploys only happen through GitHub Actions
# (.github/workflows/deploy.yml), after tests pass, and prod only after approval.
# Plan names/prices: check https://render.com/pricing when you create these.

databases:
  - name: ledger-staging-db
    databaseName: ledger
    plan: basic-256mb
    postgresMajorVersion: "16"
  - name: ledger-prod-db
    databaseName: ledger
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: ledger-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-staging-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: ledger-prod
    runtime: node
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-prod-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
