# Render Blueprint: two separate environments (staging, production), each its own
# free web service. Databases live on Neon (free, permanent), one per environment;
# paste each connection string as DATABASE_URL when Render asks.
#
# Free web services sleep after 15 minutes without visitors and take about a
# minute to wake. To remove that, change `plan: free` to a paid plan, or move to
# self-hosting with the Dockerfile (see README "Hosting").
#
# autoDeploy is OFF on purpose: deploys only happen through GitHub Actions
# (.github/workflows/deploy.yml), after tests pass, and prod only after approval.

services:
  - type: web
    name: ledger-staging
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: ledger-prod
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
