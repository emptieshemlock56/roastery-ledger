# Optional: run the production-style setup locally (real Postgres + built app).
# Most development does not need this; `npm run dev` is enough.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      retries: 10
  app:
    build: .
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
